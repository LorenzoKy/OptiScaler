name: Build Venom XeFG diagnostic time test DLL
on:
  workflow_dispatch:
  push:
    branches: [ "ci/venom-xefg-diag-time" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        run: msbuild OptiScaler.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Upload Release DLL
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-venom-xefg-diag-time
          path: x64/Release/a/OptiScaler.dll
          if-no-files-found: error
